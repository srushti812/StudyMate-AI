<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ask AI | StudyMate AI</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/chat.css') }}">
</head>
<body>

<nav class="navbar navbar-dark bg-primary">
    <div class="container">
        <span class="navbar-brand fw-bold">🤖 StudyMate AI</span>
        <a href="/dashboard" class="btn btn-light">Dashboard</a>
    </div>
</nav>

<div class="container mt-5">

    <div class="chat-box">

        <h2 class="text-center text-primary">Ask AI</h2>

        <p class="text-center text-muted">
            Ask questions about your uploaded PDF
        </p>

        <input
            type="text"
            id="question"
            class="form-control mb-3"
            placeholder="Ask your question here">

        <button
            id="askBtn"
            class="btn btn-primary w-100">
            Ask AI
        </button>

        <div
            id="answer"
            class="alert alert-light mt-4">
        </div>

    </div>

</div>

<script src="{{ url_for('static', filename='js/chat.js') }}"></script>

</body>
</html>
